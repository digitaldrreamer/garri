<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* A4 with a round margin: the page box is the first thing under test. */
  @page { size: 210mm 297mm; margin: 20mm; }
  html, body { margin: 0; padding: 0; background: #fff; }

  @font-face { font-family: "Probe"; src: url("/fixtures/font.ttf") format("truetype"); }
  body { font-family: "Probe"; font-size: 16px; line-height: 24px; width: 170mm; }

  /* Baseline control: one plain paragraph, one line, no wrapping. */
  #base { margin: 0 0 20px; }

  /* Marker placement across sizes — numeric markers are text in the PDF,
     so they can be matched by string rather than by guessing at a glyph. */
  ol { margin: 0 0 14px; padding-left: 40px; }
  ol li { margin: 0; }
  #m12 { font-size: 12px; line-height: 18px; }
  #m16 { font-size: 16px; line-height: 24px; }
  #m24 { font-size: 24px; line-height: 34px; }
  #m32 { font-size: 32px; line-height: 44px; }
</style></head><body>

  <p id="base">Baseline probe line one</p>

  <ol id="m12"><li>Marker twelve</li></ol>
  <ol id="m16"><li>Marker sixteen</li></ol>
  <ol id="m24"><li>Marker twentyfour</li></ol>
  <ol id="m32"><li>Marker thirtytwo</li></ol>

</body></html>
